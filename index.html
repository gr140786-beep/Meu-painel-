    var novos=[];G.erros=[];
    rs.forEach(function(r){
      if(r.status===200&&r.j&&r.j.ok){G.hoje=r.j.hoje||G.hoje;(r.j.clientes||[]).forEach(function(c){c.app=r.f.app;novos.push(c)})}
      else{G.erros.push(r.f.nome+": "+(r.status===401?"a PAINEL_SENHA na Netlify deste app não é painel8473gustavo.":r.status===404?"o arquivo api.mjs novo ainda não está no ar.":((r.j&&r.j.erro)||"não respondeu.")));G.clientes.filter(function(c){return c.app===r.f.app}).forEach(function(c){novos.push(c)})}
    });
    if(!G.hoje)G.hoje=diaBR(new Date().toISOString());
    novos.sort(function(a,b){return String(b.criado||"").localeCompare(String(a.criado||""))});
    G.clientes=novos;G.quando=new Date();desenhar();
  });
}

function doApp(){return G.clientes.filter(function(c){return G.aba==="tudo"||c.app===G.aba})}

function grafico(L){
  var dias=[];for(var i=29;i>=0;i--)dias.push(somaDias(G.hoje,-i));
  var cont={};L.forEach(function(c){var d=diaBR(c.criado);if(!cont[d])cont[d]={imovyn:0,orcahub:0};cont[d][c.app]++});
  var max=1;dias.forEach(function(d){var x=cont[d];if(x)max=Math.max(max,x.imovyn+x.orcahub)});
  var barras=dias.map(function(d){var x=cont[d]||{imovyn:0,orcahub:0},t=x.imovyn+x.orcahub;
    return '<div class="c'+(t?'':' vz')+'" title="'+fmtDia(d)+': '+t+'">'+(x.imovyn?'<i style="height:'+(x.imovyn/max*100)+'%;background:var(--im)"></i>':'')+(x.orcahub?'<i style="height:'+(x.orcahub/max*100)+'%;background:var(--oh)"></i>':'')+'</div>'}).join("");
  var tot=dias.reduce(function(s,d){var x=cont[d];return s+(x?x.imovyn+x.orcahub:0)},0);
  return '<div class="card"><h2>Chegadas nos últimos 30 dias: '+tot+'</h2><div class="graf" role="img" aria-label="Cadastros por dia nos últimos 30 dias">'+barras+'</div><div class="graf-x"><span>'+fmtDia(dias[0]).slice(0,5)+'</span><span>Hoje</span></div>'+
    (G.aba==="tudo"?'<div class="leg"><span><i style="background:var(--im)"></i>Imovyn</span><span><i style="background:var(--oh)"></i>OrçaHub</span></div>':'')+'</div>';
}

function cartao(c){
  var linhas=[];
  var sub=[c.pessoa,c.ramo,c.cidade].filter(Boolean).join(" · ");
  linhas.push(["Entrou",fmtDia(diaBR(c.criado))||"-"]);
  linhas.push(["Último uso",haQuanto(c.ultimoUso)]);
  var pl=c.plano==="anual"?"Anual":c.plano==="mensal"?"Mensal":"";
  if(c.situacao==="teste")linhas.push(["Teste",(pl?pl+" "+brl(c.valor)+". ":"")+"1ª cobrança em "+fmtDia(c.cobrancaEm)]);
  else if(c.situacao==="ativa"||c.situacao==="atrasada"||c.situacao==="pendente")linhas.push(["Plano",(pl||"-")+(c.valor?" "+brl(c.valor):"")+(c.forma==="cartao"?" no cartão":c.forma?" no Pix":"")+(c.validoAte?". Pago até "+fmtDia(c.validoAte):"")]);
  else if(c.situacao==="cancelada")linhas.push(["Cancelou",(c.canceladaEm?fmtDia(c.canceladaEm):"")+(c.validoAte&&c.validoAte>=G.hoje?". Usa até "+fmtDia(c.validoAte):"")]);
  else if(c.situacao==="vencida")linhas.push(["Venceu",fmtDia(c.validoAte)]);
  if(c.pago)linhas.push(["Já pagou",brl(c.pago)+" ("+c.nPagamentos+(c.nPagamentos===1?" pagamento)":" pagamentos)")]);
  if(c.detalhes)linhas.push(["Usa",c.detalhes]);
  if(c.email)linhas.push(["E-mail",c.email]);
  if(c.telefone)linhas.push(["Telefone",c.telefone]);
  var w=telWa(c.telefone),nome=(c.pessoa||"").split(" ")[0];
  var msg="Olá"+(nome?" "+nome:"")+", tudo bem? Aqui é o Gustavo, do "+NOME_APP[c.app]+". ";
  if(c.situacao==="sem"||c.situacao==="login")msg+="Vi que você fez o cadastro. Posso te ajudar a começar o seu mês grátis?";
  else if(c.situacao==="teste")msg+="Como está sendo o seu teste? Posso te ajudar em alguma coisa?";
  else if(c.situacao==="atrasada"||c.situacao==="vencida")msg+="Vi que o último pagamento não passou. Posso te ajudar a resolver?";
  else if(c.situacao==="cancelada")msg+="Vi que você cancelou. Pode me contar o que faltou para continuar?";
  else msg+="Obrigado por usar o "+NOME_APP[c.app]+"! Precisando de algo, é só chamar.";
  return '<div class="cl"><div class="cl-h"><span class="app '+c.app+'">'+NOME_APP[c.app]+'</span><div><b>'+esc(c.nome)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div><span class="pill p-'+esc(c.situacao)+'">'+esc(c.fundador?"Fundador":(SIT[c.situacao]||c.situacao))+'</span></div>'+
    '<dl>'+linhas.map(function(l){return '<dt>'+esc(l[0])+'</dt><dd>'+esc(l[1])+'</dd>'}).join("")+'</dl>'+
    '<div class="cl-a">'+(w?'<a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/'+w+'?text='+encodeURIComponent(msg)+'">'+IC.wa+'WhatsApp</a>':'')+(c.email?'<a class="btn sm" href="mailto:'+esc(c.email)+'">'+IC.mail+'E-mail</a>':'')+'</div></div>';
}

function desenhar(){
  var L=doApp(),H=G.hoje;
  var conta=function(fn){return L.filter(fn).length};
  var pagando=L.filter(function(c){return c.situacao==="ativa"});
  var receita=pagando.reduce(function(s,c){return s+mensal(c)},0);
  var emTeste=L.filter(function(c){return c.situacao==="teste"});
  var previsao=emTeste.reduce(function(s,c){return s+mensal(c)},0);
  var recebido=L.reduce(function(s,c){return s+(Number(c.pago)||0)},0);
  var base=L.filter(function(c){return c.situacao!=="login"}).length;
  var viraram=L.filter(function(c){return c.nPagamentos>0}).length;
  var acaba=conta(testeAcaba),nao=conta(naoPagou),atr=conta(function(c){return c.situacao==="atrasada"||c.situacao==="vencida"});
  var filtro=FILTROS.filter(function(f){return f[0]===G.filtro})[0]||FILTROS[0];
  var q=G.busca.trim().toLowerCase();
  var lista=L.filter(filtro[2]).filter(function(c){return !q||[c.nome,c.pessoa,c.email,c.telefone,c.cidade,c.ramo].join(" ").toLowerCase().indexOf(q)>=0});
  var k=function(t,v,s,cls){return '<div class="k'+(cls?" "+cls:"")+'"><span>'+t+'</span><b>'+v+'</b>'+(s?'<small>'+s+'</small>':'')+'</div>'};
  var al=function(f,n,txt,cls){return '<button class="al '+(n?cls:"zero")+'" data-f="'+f+'"><b>'+n+'</b><span>'+txt+'</span></button>'};
  var foco=document.activeElement&&document.activeElement.id==="q";
  document.getElementById("app").innerHTML=
   '<div class="top"><div class="top-in"><div class="marca"><i></i><span>Meu Painel<small>'+(G.quando?"Atualizado às "+G.quando.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"")+'</small></span></div><button class="btn sm" id="att" aria-label="Atualizar">'+IC.att+'<span>Atualizar</span></button></div></div>'+
   '<div class="wrap">'+
   '<div class="abas" role="tablist">'+[["tudo","Tudo"],["imovyn","Imovyn"],["orcahub","OrçaHub"]].map(function(a){return '<button role="tab" aria-selected="'+(G.aba===a[0])+'" class="'+(G.aba===a[0]?"on":"")+'" data-aba="'+a[0]+'">'+a[1]+'</button>'}).join("")+'</div>'+
   G.erros.map(function(e){return '<div class="aviso bad">'+esc(e)+'</div>'}).join("")+
   '<div class="kpis">'+
     k("Chegaram hoje",conta(function(c){return diaBR(c.criado)===H})," ","dest")+
     k("Últimos 7 dias",conta(function(c){return ehNovo(c,7)}),"Últimos 30 dias: "+conta(function(c){return ehNovo(c,30)}))+
     k("Em teste grátis",emTeste.length,previsao?"Se pagarem: + "+brl(previsao)+"/mês":"")+
     k("Pagando",pagando.length,base?"Viraram clientes: "+viraram+" de "+base:"")+
     k("Entra por mês",brl(receita),"Anual conta como 1/12")+
     k("Já recebido",brl(recebido),"Soma de todos os pagamentos")+
     k("Total de cadastros",L.length,conta(function(c){return c.situacao==="login"})?conta(function(c){return c.situacao==="login"})+" só fizeram o login":"")+
     k("Cancelaram",conta(function(c){return c.situacao==="cancelada"}),"")+
   '</div>'+
   '<div class="alertas">'+al("acaba",acaba,acaba===1?"teste acaba nos próximos 7 dias":"testes acabam nos próximos 7 dias","info")+al("nao",nao,nao===1?"entrou e não pagou":"entraram e não pagaram","warn")+al("atrasado",atr,atr===1?"pagamento atrasado ou vencido":"pagamentos atrasados ou vencidos","bad")+'</div>'+
   grafico(L)+
   '<div class="filtros" role="tablist">'+FILTROS.map(function(f){return '<button class="'+(G.filtro===f[0]?"on":"")+'" data-filtro="'+f[0]+'">'+f[1]+'<em>'+L.filter(f[2]).length+'</em></button>'}).join("")+'</div>'+
   '<div class="busca"><input id="q" type="search" placeholder="Buscar por nome, e-mail, telefone ou cidade" value="'+esc(G.busca)+'" aria-label="Buscar"></div>'+
   '<div class="lista">'+(lista.length?lista.map(cartao).join(""):'<div class="vazio">'+(L.length?"Ninguém neste filtro.":"Ainda não chegou ninguém. Quando alguém se cadastrar, aparece aqui.")+'</div>')+'</div>'+
   '<div class="rod"><span>'+lista.length+(lista.length===1?" cadastro na lista":" cadastros na lista")+'</span><span style="display:flex;gap:8px"><button class="btn sm" id="csv">'+IC.down+'Baixar planilha</button></span></div>'+
   '</div>';
  document.querySelectorAll("[data-aba]").forEach(function(b){b.onclick=function(){G.aba=b.dataset.aba;desenhar()}});
  document.querySelectorAll("[data-filtro]").forEach(function(b){b.onclick=function(){G.filtro=b.dataset.filtro;desenhar()}});
  document.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){G.filtro=b.dataset.f;desenhar();var x=$(".filtros");if(x)x.scrollIntoView({behavior:"smooth",block:"start"})}});
  $("#att").onclick=function(){carregar(false)};
  $("#csv").onclick=function(){baixar(lista)};
  var qi=$("#q");qi.oninput=function(){G.busca=qi.value;var p=qi.selectionStart;desenhar();var n=$("#q");n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
  if(foco){qi.focus()}
}

function baixar(L){
  var cab=["App","Nome","Pessoa","E-mail","Telefone","Cidade","Situação","Plano","Valor","Entrou","Último uso","1ª cobrança","Pago até","Já pagou","Detalhes"];
  var cel=function(v){v=String(v==null?"":v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var linhas=L.map(function(c){return [NOME_APP[c.app],c.nome,c.pessoa,c.email,c.telefone,c.cidade,SIT[c.situacao]||c.situacao,c.plano,String(c.valor||0).replace(".",","),fmtDia(diaBR(c.criado)),c.ultimoUso?fmtDia(diaBR(c.ultimoUso)):"",fmtDia(c.cobrancaEm),fmtDia(c.validoAte),String(c.pago||0).replace(".",","),c.detalhes].map(cel).join(";")});
  var blob=new Blob(["﻿"+[cab.join(";")].concat(linhas).join("\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cadastros-"+G.hoje+".csv";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}

setInterval(function(){if(G.senha&&!document.hidden&&G.clientes.length)carregar(false)},120000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&G.senha&&G.quando&&Date.now()-G.quando>60000)carregar(false)});
/* Abre direto, sem pedir senha: a chave fica aqui dentro e precisa ser igual à PAINEL_SENHA da Netlify dos dois apps */
var CHAVE="painel8473gustavo";
G.senha=CHAVE;
document.getElementById("app").innerHTML='<div class="login"><p style="color:var(--muted)">Carregando…</p></div>';carregar(true);
})();
</script>
</body>
